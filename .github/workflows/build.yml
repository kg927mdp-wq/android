
name: Build XION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate XION Project
        id: locate
        run: |
          SETTINGS=$(find . -name settings.gradle.kts \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.locate.outputs.dir }}" \
            assembleDebug

      - name: Upload XION APK
        uses: actions/upload-artifact@v4
        with:
          name: XION-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
