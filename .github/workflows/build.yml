name: Build XION APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract XION Source
        run: |
          if [ ! -f "XION-Android-Source.zip" ]; then
            echo "XION source ZIP not found!"
            exit 1
          fi

          mkdir -p xion-source
          unzip -o XION-Android-Source.zip -d xion-source

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Project
        id: locate
        run: |
          SETTINGS=$(find xion-source -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found!"
            find xion-source -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "XION project found: $PROJECT_DIR"

      - name: Build XION APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.locate.outputs.dir }}" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XION-APK
          path: xion-source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
